name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-macos:
    name: Build & Release (macOS arm64)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & package DMG
        run: |
          set -o pipefail
          {
            npm run build
            npx electron-builder --mac --publish never
          } 2>&1 | tee /tmp/build.log || {
            tail -10 /tmp/build.log | tr -d '\r' \
              | sed 's/%/%25/g' | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          }

      - name: Upload DMG to release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') }}
          generate_release_notes: true
          files: |
            dist/*.dmg
